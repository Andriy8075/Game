services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: io_shooter
    ports:
      - "5432:5432"
    volumes:
      - io_shooter_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d io_shooter"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  io_shooter_pg:
