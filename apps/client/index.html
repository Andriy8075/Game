<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>.io Shooter</title>
    <style>
      html,
      body,
      #game {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b2416;
      }

      body {
        font-family: "Segoe UI", sans-serif;
      }

      body.in-game,
      body.in-game #game {
        cursor: crosshair;
      }

      #menu[hidden],
      #game[hidden] {
        display: none !important;
      }

      #menu {
        min-height: 100%;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(129, 199, 132, 0.18), transparent 42%),
          #1b2416;
      }

      .menu-card {
        width: min(420px, calc(100% - 32px));
        padding: 32px 28px 28px;
        background: #12180f;
        border: 1px solid #3e5230;
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        color: #f5f5f5;
      }

      .menu-card h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: 0.03em;
      }

      .menu-card p {
        margin: 0 0 24px;
        color: #dce7d4;
        line-height: 1.4;
      }

      .menu-card label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        color: #c8e6c9;
      }

      .menu-card input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #4e623c;
        background: #1b2416;
        color: #f7f3ea;
        font: inherit;
        font-size: 16px;
      }

      .menu-card input:focus {
        outline: 2px solid #81c784;
        border-color: #81c784;
      }

      .menu-card input::placeholder {
        color: #9aab90;
      }

      .menu-card button {
        margin-top: 18px;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 8px;
        background: #66bb6a;
        color: #102016;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }

      .menu-card button:hover {
        background: #81c784;
      }

      .menu-card h2 {
        margin: 18px 0 8px;
        font-size: 20px;
      }

      .account-actions {
        display: flex;
        gap: 8px;
      }

      .account-actions button {
        flex: 1;
        margin-top: 10px;
      }

      .menu-card button.secondary {
        background: transparent;
        color: #c8e6c9;
        border: 1px solid #4e623c;
        font-weight: 600;
      }

      .menu-card button.secondary:hover {
        background: #24321c;
      }

      #account-status {
        margin: 0 0 16px;
        color: #c8e6c9;
      }

      .auth-error {
        margin: 12px 0 0;
        color: #ffab91;
      }

      .weapon-picker {
        margin: 16px 0 0;
        padding: 12px 14px 14px;
        border: 1px solid #4e623c;
        border-radius: 8px;
      }

      .weapon-picker legend {
        padding: 0 6px;
        color: #c8e6c9;
        font-size: 14px;
      }

      .weapon-options {
        display: grid;
        gap: 8px;
      }

      .menu-card .weapon-options label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 0;
        line-height: 1.3;
      }

      .menu-card .weapon-options input {
        width: auto;
        margin: 2px 0 0;
        flex: none;
      }

      #auth-form[hidden],
      #logout-button[hidden],
      #account-status[hidden],
      .auth-error[hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <div class="menu-card">
        <form id="menu-form">
          <h1>.io Shooter</h1>
          <p id="menu-intro">Enter a name, then press play to join the match.</p>
          <p id="account-status" hidden></p>
          <label for="player-name">Name</label>
          <input
            id="player-name"
            name="playerName"
            type="text"
            maxlength="16"
            autocomplete="nickname"
            autofocus
            required
          />
          <fieldset id="weapon-picker" class="weapon-picker">
            <legend>Weapon</legend>
            <div id="weapon-options" class="weapon-options"></div>
          </fieldset>
          <button id="play-button" type="submit">Play</button>
          <div class="account-actions">
            <button id="show-signup" class="secondary" type="button">Sign up</button>
            <button id="show-login" class="secondary" type="button">Log in</button>
            <button id="logout-button" class="secondary" type="button" hidden>Log out</button>
          </div>
        </form>
        <form id="auth-form" hidden>
          <h2 id="auth-title">Sign up</h2>
          <label for="auth-email">Email</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" required />
          <label for="auth-password">Password</label>
          <input
            id="auth-password"
            name="password"
            type="password"
            minlength="6"
            autocomplete="new-password"
            required
          />
          <button id="auth-submit" type="submit">Create account</button>
          <button id="google-button" class="secondary" type="button">Continue with Google</button>
          <button id="auth-back" class="secondary" type="button">Back</button>
          <p id="auth-error" class="auth-error" hidden></p>
        </form>
      </div>
    </div>
    <div id="game" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
